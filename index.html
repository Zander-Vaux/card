<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zander & Barney - Toronto</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .heart {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: inline-block;
            user-select: none;
        }

        .heart:hover {
            transform: scale(1.2);
        }

        .heart:active {
            transform: scale(0.9);
        }

        .content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s ease;
        }

        .content.show {
            max-height: 600px;
        }

        .names {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0 20px 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease 0.2s;
        }

        .content.show .names {
            opacity: 1;
            transform: translateY(0);
        }

        .location {
            font-size: 28px;
            color: #764ba2;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease 0.4s;
        }

        .content.show .location {
            opacity: 1;
            transform: translateY(0);
        }

        .stick-figures {
            margin: 30px 0;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease 0.5s;
        }

        .content.show .stick-figures {
            opacity: 1;
            transform: translateY(0);
        }

        .toronto-skyline {
            margin-top: 30px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.5s ease 0.6s;
        }

        .content.show .toronto-skyline {
            opacity: 1;
            transform: translateY(0);
        }

        .instruction {
            font-size: 18px;
            color: #666;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="heart" id="heart">❤️</div>
        <p class="instruction">Click the heart</p>
        <div class="content" id="content">
            <div class="names">Zander & Barney</div>
            <div class="location">Toronto</div>
            
            <!-- Stick Figures Holding Hands -->
            <div class="stick-figures">
                <svg width="200" height="120" viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
                    <!-- Left stick figure (Zander) -->
                    <circle cx="50" cy="20" r="12" fill="#667eea" stroke="#333" stroke-width="2"/>
                    <line x1="50" y1="32" x2="50" y2="70" stroke="#333" stroke-width="3"/>
                    <line x1="50" y1="45" x2="30" y2="60" stroke="#333" stroke-width="3"/>
                    <line x1="50" y1="45" x2="70" y2="55" stroke="#333" stroke-width="3"/>
                    <line x1="50" y1="70" x2="35" y2="100" stroke="#333" stroke-width="3"/>
                    <line x1="50" y1="70" x2="65" y2="100" stroke="#333" stroke-width="3"/>
                    
                    <!-- Right stick figure (Barney) -->
                    <circle cx="150" cy="20" r="12" fill="#764ba2" stroke="#333" stroke-width="2"/>
                    <line x1="150" y1="32" x2="150" y2="70" stroke="#333" stroke-width="3"/>
                    <line x1="150" y1="45" x2="170" y2="60" stroke="#333" stroke-width="3"/>
                    <line x1="150" y1="45" x2="130" y2="55" stroke="#333" stroke-width="3"/>
                    <line x1="150" y1="70" x2="135" y2="100" stroke="#333" stroke-width="3"/>
                    <line x1="150" y1="70" x2="165" y2="100" stroke="#333" stroke-width="3"/>
                    
                    <!-- Holding hands -->
                    <line x1="70" y1="55" x2="130" y2="55" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Hearts above -->
                    <text x="95" y="15" font-size="20" text-anchor="middle">💕</text>
                </svg>
            </div>

            <!-- Toronto Skyline -->
            <div class="toronto-skyline">
                <svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
                    <!-- Sky gradient -->
                    <defs>
                        <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                    <rect width="400" height="150" fill="url(#skyGradient)"/>
                    
                    <!-- CN Tower (iconic) -->
                    <rect x="180" y="30" width="8" height="90" fill="#666"/>
                    <circle cx="184" cy="25" r="8" fill="#999"/>
                    <polygon points="184,15 179,25 189,25" fill="#999"/>
                    
                    <!-- Buildings -->
                    <rect x="50" y="80" width="40" height="70" fill="#4a5568"/>
                    <rect x="100" y="70" width="35" height="80" fill="#2d3748"/>
                    <rect x="145" y="85" width="30" height="65" fill="#4a5568"/>
                    <rect x="200" y="75" width="45" height="75" fill="#2d3748"/>
                    <rect x="255" y="90" width="35" height="60" fill="#4a5568"/>
                    <rect x="300" y="70" width="50" height="80" fill="#2d3748"/>
                    
                    <!-- Windows on buildings -->
                    <g fill="#ffd700" opacity="0.8">
                        <rect x="55" y="85" width="5" height="5"/>
                        <rect x="65" y="85" width="5" height="5"/>
                        <rect x="75" y="85" width="5" height="5"/>
                        <rect x="55" y="95" width="5" height="5"/>
                        <rect x="65" y="95" width="5" height="5"/>
                        <rect x="75" y="95" width="5" height="5"/>
                        
                        <rect x="105" y="75" width="5" height="5"/>
                        <rect x="115" y="75" width="5" height="5"/>
                        <rect x="125" y="75" width="5" height="5"/>
                        <rect x="105" y="85" width="5" height="5"/>
                        <rect x="115" y="85" width="5" height="5"/>
                        <rect x="125" y="85" width="5" height="5"/>
                        
                        <rect x="210" y="80" width="5" height="5"/>
                        <rect x="220" y="80" width="5" height="5"/>
                        <rect x="230" y="80" width="5" height="5"/>
                        <rect x="210" y="90" width="5" height="5"/>
                        <rect x="220" y="90" width="5" height="5"/>
                        <rect x="230" y="90" width="5" height="5"/>
                        
                        <rect x="310" y="75" width="5" height="5"/>
                        <rect x="320" y="75" width="5" height="5"/>
                        <rect x="330" y="75" width="5" height="5"/>
                        <rect x="310" y="85" width="5" height="5"/>
                        <rect x="320" y="85" width="5" height="5"/>
                        <rect x="330" y="85" width="5" height="5"/>
                    </g>
                    
                    <!-- Ground -->
                    <rect y="150" width="400" height="10" fill="#2d3748"/>
                    
                    <!-- Text -->
                    <text x="200" y="20" font-family="Arial" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Toronto Skyline</text>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const heart = document.getElementById('heart');
        const content = document.getElementById('content');

        heart.addEventListener('click', function() {
            content.classList.toggle('show');
        });
    </script>
</body>
</html>
